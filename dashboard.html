<script>
'use strict';
// Standalone preview: no secrets, no network calls, no real stock data.
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const percent=n=>(n>0?'+':'')+n.toFixed(2)+'%';
const statusTag={SUCCESS:'SUCCESS',FAIL:'FAIL',TRACKING:'진행 중',WAIT:'D+1 대기'};
const suffix=['반도체','바이오','산업','전력','건설','자동화','로보틱스','솔루션','에너지','통신','제약','정밀','기술','금융','모빌리티','소재','모터스','플랫폼','화학','시스템','기계','정보','네트웍스','테크','소프트','인프라','물류','전자','헬스','모멘텀'];
const sectors=['반도체','바이오','건설','전력','기계','IT','금융','산업','2차전지'];
const baseReasons=[['추세·돌파','최근 구조상 추세 지속 가능성이 있는 가상 구간'],['거래량 확인','데모 거래량 지표가 기준치 위에서 유지되는 설정'],['모멘텀','데모 지표에서 상승 탄력 신호 포착'],['리테스트','돌파 후 되돌림 지지 여부를 점검할 예정'],['리스크 관리','목표까지 여유와 변동성을 함께 고려한 시연 규칙']];
const state={cohort:'A',tab:'realtime',filter:'all',search:'',sort:'rank',descending:false,selected:0,day:0,scoreTab:'official'};
const seeds={A:13,B:31,C:47};
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}};
function generate(cohort){const rr=rng(seeds[cohort]);return Array.from({length:30},(_,i)=>{
 const rank=i+1,code=`D${cohort}${String(rank).padStart(4,'0')}`;
 const start=Math.round((5200+rr()*140000)/100)*100;
 const change=(rr()-.5)*10.8;
 const price=Math.max(100,Math.round(start*(1+change/100)/10)*10);
 const chart=56+Math.floor(rr()*42),momentum=53+Math.floor(rr()*46),volume=45+Math.floor(rr()*50),risk=48+Math.floor(rr()*50);
 const total=Math.round(chart*.37+momentum*.30+volume*.22+risk*.11);
 const klass=i<5?'top5':'other',status=i<4?'SUCCESS':i<7?'FAIL':i<25?'TRACKING':'WAIT';
 const successDay=status==='SUCCESS'?1+i%5:null;
 const mfe=status==='SUCCESS'?3.3+rr()*5.4:rr()*2.7;
 const mae=-(rr()*4.2+.15);
 const reasons=baseReasons.map((r,j)=>[r[0],r[1]]);
 return {rank,code,name:`데모 ${suffix[i]} ${String.fromCharCode(65+i%26)}`,sector:sectors[i%sectors.length],market:i%3===0?'KOSDAQ':'KOSPI',start,price,change,goal:Math.round(start*1.03/10)*10,chart,momentum,volume,risk,total,status,successDay,mfe,mae,top5:klass==='top5',reasons,cohort};
 });}
const cohorts={A:generate('A'),B:generate('B'),C:generate('C')};
const data=()=>cohorts[state.cohort];
const selected=()=>data()[state.selected]||data()[0];
const completions=a=>a.filter(r=>r.status==='SUCCESS'||r.status==='FAIL');
const winrate=a=>{let c=completions(a);return c.length?100*c.filter(r=>r.status==='SUCCESS').length/c.length:0};
const mean=(rows,k)=>rows.length?rows.reduce((a,r)=>a+r[k],0)/rows.length:0;
function spark(vals,color='#3c93f3',h=45){const min=Math.min(...vals),max=Math.max(...vals),range=Math.max(max-min,1);const p=vals.map((v,i)=>[i/(vals.length-1)*186,40-(v-min)/range*29]);let lines=p.map(x=>x.join(',')).join(' ');const fill='0,43 '+lines+' 186,43';return `<svg class="spark" viewBox="0 0 186 45" preserveAspectRatio="none" aria-hidden="true"><polyline points="${fill}" fill="${color}1b" stroke="none"/><polyline points="${lines}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
const trend=(s,n=17)=>{let v=50;const r=rng(s);return Array.from({length:n},()=>v+=(r()-.44)*9)};
function summary(){const records=data(), done=completions(records), top=records.filter(x=>x.top5), w=winrate(records),dayRates=[58,68,76,62,Math.round(w)];
 const k=(title,value,sub,icon,plot)=>`<article class="card kpi"><div class="kpi-head"><span class="kpi-icon">${icon}</span>${title}<span class="hint" title="가상 데이터">ⓘ</span></div><div class="kpi-num mono">${value}</div><div class="kpi-sub">${sub}</div>${plot||''}</article>`;
 $('summary').innerHTML=[
 k('헌터 성공률',w.toFixed(1)+'%',`<span>완료 ${done.length}종</span><span>추적 ${records.filter(x=>x.status==='TRACKING').length}종</span>`,'◎',spark(trend(seeds[state.cohort]),'#3e96ff')),
 k('종합 점수',mean(records,'total').toFixed(1)+' <small>/ 100</small>',`<span>선정시점 가상 점수</span>`,'♜',spark(trend(seeds[state.cohort]+5),'#f07b89')),
 k('DAY별 성공현황','5 DAY <small>VIEW</small>',`<span>시연 성공률 ${Math.round(w)}%</span>`,'▥',`<div class="daybars">${dayRates.map((x,i)=>`<button type="button" aria-label="DAY ${i+1} 예시 ${x}%" data-day="${i}" style="height:${Math.max(13,x)}%"></button>`).join('')}</div><div class="day-labels">${dayRates.map((x,i)=>`<span>D${i+1}</span>`).join('')}</div>`),
 k('ACTIVE 코호트','3 <small>DAY</small>','<span>샘플 3개 그룹</span><span>실제 MASTER 미연결</span>','♧',spark(trend(11),'#4b95f4')),
 k('TOP5 평균 MFE',`+${mean(top,'mfe').toFixed(2)}%`,'<span>샘플 장중 최대상승폭</span>','↗',spark(trend(23),'#30d9ac')),
 k('TOP5 평균 MAE',`${mean(top,'mae').toFixed(2)}%`,'<span>샘플 장중 최대하락폭</span>','↘',spark(trend(33),'#f15f79')),
 `<article class="card kpi"><div class="kpi-head"><span class="kpi-icon">▤</span>운영 체크포인트</div><ul class="checkpoints"><li><i></i><span>08:30 공식 선정 · TOP5</span></li><li><i></i><span>15:40 분석 자동 사이클</span></li><li><i></i><span>16:20 MASTER 검증</span></li><li><i></i><span>복구 실행은 별도 승인</span></li></ul></article>`
 ].join('');
 document.querySelectorAll('[data-day]').forEach(x=>x.onclick=()=>{state.tab='days';state.day=Number(x.dataset.day);render()});
}
function chip(status){return `<span class="status ${status==='SUCCESS'?'success':status==='FAIL'?'fail':status==='TRACKING'?'track':'wait'}">${statusTag[status]}</span>`}
function progress(r){const pct=Math.max(0,Math.min(100,r.mfe/3*100));return `<span class="cell-progress"><i style="--progress:${pct}%"></i></span><span class="muted">${Math.round(pct)}%</span>`}
function score(n){return `<span class="score"><span class="score-bar"><i style="width:${n}%"></i></span><b>${n}</b></span>`}
function filters(){return `<div class="filters"><button class="filterbtn ${state.filter==='all'?'active':''}" data-filter="all">전체 (${data().length})</button><button class="filterbtn ${state.filter==='kospi'?'active':''}" data-filter="kospi">KOSPI (${data().filter(r=>r.market==='KOSPI').length})</button><button class="filterbtn ${state.filter==='kosdaq'?'active':''}" data-filter="kosdaq">KOSDAQ (${data().filter(r=>r.market==='KOSDAQ').length})</button><button class="filterbtn ${state.filter==='top5'?'active':''}" data-filter="top5">TOP5 (5)</button><button class="filterbtn ${state.filter==='success'?'active':''}" data-filter="success">SUCCESS (${data().filter(r=>r.status==='SUCCESS').length})</button><div class="right-tools"><label class="sr" for="search">종목명 검색</label><input id="search" class="searchbox" type="search" placeholder="종목명 · 코드 검색" value="${esc(state.search)}"><label class="sr" for="sort">정렬 기준</label><select class="toolselect" id="sort"><option value="rank">선정 순위</option><option value="total">종합점수</option><option value="change">등락률</option><option value="momentum">모멘텀점수</option><option value="chart">차트점수</option></select></div></div>`}
function filtered(){let a=data().filter(r=>(state.filter==='all'||state.filter==='kospi'&&r.market==='KOSPI'||state.filter==='kosdaq'&&r.market==='KOSDAQ'||state.filter==='top5'&&r.top5||state.filter==='success'&&r.status==='SUCCESS')&&[r.name,r.code,r.sector].join(' ').toLowerCase().includes(state.search.toLowerCase()));a.sort((x,y)=>{let d=x[state.sort]-y[state.sort];return (state.sort==='rank'?1:-1)*(state.descending?-1:1)*d});return a}
function table(){const rows=filtered();const headers=[['rank','순위'],['name','종목명'],['price','현재가'],['change','등락률'],['goal','3% 목표가'],['status','진행상태'],['chart','차트점수'],['momentum','모멘텀'],['total','종합점수'],['cohort','코호트']];const head=headers.map(([key,text])=>`<th>${key==='name'||key==='cohort'||key==='status'?text:`<button data-sort="${key}" title="${text} 정렬">${text} ${state.sort===key?(state.descending?'↓':'↑'):'↕'}</button>`}</th>`).join('');const tbody=rows.map(r=>`<tr data-select="${r.rank-1}" tabindex="0" class="${r.rank-1===state.selected?'selected':''}" aria-label="${esc(r.name)} 상세보기"><td>${String(r.rank).padStart(2,'0')}</td><td><span class="stock-name">${esc(r.name)}</span><span class="stock-code">${r.code} · ${r.market}</span></td><td class="mono">${money(r.price)}</td><td class="mono ${r.change>=0?'positive':'negative'}">${percent(r.change)}</td><td class="mono">${money(r.goal)}</td><td>${chip(r.status)} ${r.status==='TRACKING'?progress(r):''}</td><td>${score(r.chart)}</td><td>${score(r.momentum)}</td><td><strong>${r.total}</strong></td><td><span class="mini-tag">DEMO-${state.cohort}</span></td></tr>`).join('');return `<div class="data-wrap"><table class="stock-table"><thead><tr>${head}</tr></thead><tbody>${tbody||'<tr><td colspan="10" class="empty">선택한 조건에 맞는 데모 종목이 없습니다.</td></tr>'}</tbody></table></div><div class="table-foot"><span>표시 ${rows.length} / 전체 30종 · 행을 누르면 오른쪽 분석이 바뀝니다.</span><span>현재가·목표가·성과 모두 가상 데이터</span></div>`}
function realtime(){return `<div class="ghostlock"><span>◉</span><span><strong>실시간 탭 디자인</strong> — 지금은 데모 현재가를 표시합니다. 키움 WebSocket 미연결 · 실제 틱 데이터 없음 · 주문 기능 없음.</span></div>${filters()}${table()}`}
function reasonsView(){let r=selected();return `<h2 class="panel-title">선정 이유 · 분석 점수</h2><p class="panel-sub">표에서 선택한 가상 종목 <b>${esc(r.name)}</b>의 선정 근거. 아래 문구는 실제 분석 결과가 아닌 예시입니다.</p><div class="demo-alert">선정 사유는 미래의 실제 MASTER에 저장된 <b>선정 당시 스냅샷</b>을 표시해야 해. 사후 뉴스·가격을 이유에 끼워 넣지 않습니다.</div><div class="reason-grid">${r.reasons.map((item,i)=>`<section class="reason-card"><h4><span class="blue">0${i+1}</span> ${esc(item[0])}</h4><p>${esc(item[1])}</p></section>`).join('')}<section class="reason-card"><h4>점수 스냅샷</h4><p>차트 ${r.chart} · 모멘텀 ${r.momentum} · 거래량 ${r.volume} · 종합 ${r.total}</p></section></div><div class="section-box"><h3 class="panel-title">선정 기록 설계</h3>${[['선정 구분','시연 DAY '+state.cohort],['선정 시각','DEMO · 실제 기록 없음'],['모델 버전','DEMO_MODEL_V0.2'],['분석 기준일','시연 데이터'],['소급 변경','허용하지 않음']].map(z=>`<div class="info-row"><span>${z[0]}</span><b>${z[1]}</b></div>`).join('')}</div>`}
function top5(){const top=data().filter(r=>r.top5);return `<h2 class="panel-title">TOP5 집중 모니터링</h2><p class="panel-sub">시연 코호트의 TOP5를 클릭하면 오른쪽에서 목표가·차트·선정 이유를 확인할 수 있어.</p><div class="rank-rows">${top.map(r=>`<button class="rank-item" data-select="${r.rank-1}"><span class="rank-num">${r.rank}</span><span><b>${esc(r.name)}</b><br><small class="muted">${esc(r.sector)} · 차트 ${r.chart} · 모멘텀 ${r.momentum} · ${statusTag[r.status]}</small></span><b class="blue" style="text-align:right">${r.total}점</b></button>`).join('')}</div><div class="section-box"><div class="info-row"><span>TOP5 평균 종합 점수</span><b>${mean(top,'total').toFixed(1)} / 100</b></div><div class="info-row"><span>TOP5 평균 MFE (시연)</span><b class="positive">+${mean(top,'mfe').toFixed(2)}%</b></div><div class="info-row"><span>TOP5 평균 MAE (시연)</span><b class="negative">${mean(top,'mae').toFixed(2)}%</b></div></div>`}
function days(){const a=[0,1,2,3,4],rate=[64,71,58,78,65],idx=state.day;return `<h2 class="panel-title">DAY별 성공현황</h2><p class="panel-sub">실제 운영 시 코호트별 D+1~D+5 3% 도달 여부·최초 도달일·검증 진행률을 표시합니다.</p><div class="day-grid">${a.map(i=>`<button class="day-card ${idx===i?'active':''}" data-day="${i}"><span class="muted">DAY ${i+1} · 가상</span><b>${rate[i]}%</b><small>예시 코호트 성공률</small></button>`).join('')}</div><div class="section-box"><h3 class="panel-title">DAY ${idx+1} · 요약 (데모)</h3><div class="info-row"><span>검증 대상</span><b>30종</b></div><div class="info-row"><span>완료 기준 예시</span><b>${rate[idx]}%</b></div><div class="info-row"><span>성과 추적 규칙</span><b>D+1 실제 시초가 → D+5</b></div><div class="info-row"><span>3% 성공 판정</span><b>장중 고가 ≥ 기준가 × 1.03</b></div><div class="info-row"><span>실제 데이터</span><b class="amber">미연동</b></div></div><div class="notice">ⓘ 1차 데모 막대그래프와 DAY 값은 디자인 검증용 숫자야. 실제 성과로 해석하거나 공식 승률에 합산하면 안 돼.</div>`}
function learning(){return `<h2 class="panel-title">학습 데이터 연구실</h2><p class="panel-sub">기존 공식 결과와 과거 LEGACY_REFERENCE를 분리하며 선정 당시 점수를 성공·실패 패턴과 연결합니다.</p><div class="subtabs"><button class="${state.scoreTab==='official'?'active':''}" data-scoretab="official">신규 기준 성과</button><button class="${state.scoreTab==='legacy'?'active':''}" data-scoretab="legacy">LEGACY_REFERENCE</button></div>${state.scoreTab==='official'?`<div class="learning-grid"><div class="learning-card"><h4>차트 점수</h4><b>${mean(data(),'chart').toFixed(1)}</b><p>캔들·돌파·이평선 및 유사차트 기반 점수의 저장 위치를 마련했어.</p></div><div class="learning-card"><h4>모멘텀 점수</h4><b>${mean(data(),'momentum').toFixed(1)}</b><p>선정일 시점의 오실레이터·상승 강도 등을 고정 기록하는 항목.</p></div><div class="learning-card"><h4>결측치 관리</h4><b class="nulltag">NULL</b><p>패턴·타이밍·수급·뉴스 점수가 없으면 0이 아닌 미측정값으로 표시.</p></div></div><div class="section-box"><h3 class="panel-title">점수 × 성과 분석 설계</h3>${[['차트 80점 이상 성공률','후속 데이터 연동 예정'],['모멘텀 80점 이상 성공률','후속 데이터 연동 예정'],['고거래량 구간별 MFE·MAE','후속 데이터 연동 예정'],['최초 +3% 도달일 분포','후속 데이터 연동 예정']].map(x=>`<div class="info-row"><span>${x[0]}</span><b class="amber">${x[1]}</b></div>`).join('')}</div>`:`<div class="demo-alert">과거 8~9월 자료는 현재 공식 D+1 시초가 기준 통계와 <b>합산하지 않습니다</b>. 비교는 참고자료로만 합니다.</div><div class="section-box"><h3 class="panel-title">LEGACY_REFERENCE 운영</h3><p class="muted">추후 MASTER 연결 시 기존 백업과 오래된 자료를 별도 표시하고, 기준·모델·검증 여부를 함께 기록합니다.</p></div>`}`}
function drawCandles(r){let rand=rng((r.rank+1)*391+seeds[state.cohort]),price=100,arr=[];for(let i=0;i<36;i++){let open=price;let close=open+(rand()-.47)*4.5;let hi=Math.max(open,close)+rand()*3;let lo=Math.min(open,close)-rand()*3;arr.push({open,close,hi,lo,vol:rand()*.65+.15});price=close;}let min=Math.min(...arr.map(x=>x.lo))-2,max=Math.max(...arr.map(x=>x.hi))+2;const y=v=>10+(max-v)/(max-min)*144;const w=340,n=arr.length,gap=w/n;const candle=arr.map((x,i)=>{const cx=10+i*gap+gap/2,pos=x.close>=x.open,col=pos?'#f36a83':'#4194ff';let yo=y(x.open),yc=y(x.close),yt=y(x.hi),yb=y(x.lo);return `<line x1="${cx}" y1="${yt}" x2="${cx}" y2="${yb}" stroke="${col}" stroke-width="1.2"/><rect x="${cx-2.9}" y="${Math.min(yo,yc)}" width="5.8" height="${Math.max(2,Math.abs(yo-yc))}" fill="${col}"/><rect x="${cx-2.7}" y="${163+(1-x.vol)*37}" width="5.4" height="${x.vol*37}" fill="${col}" opacity=".58"/>`}).join('');const grid=[45,84,123,161].map(z=>`<line x1="5" y1="${z}" x2="350" y2="${z}" stroke="#284055" stroke-width=".6" stroke-dasharray="4 5"/>`).join('');return `<svg class="candles" viewBox="0 0 356 210" role="img" aria-label="${esc(r.name)} 가상 캔들 차트: 실제 시세가 아닙니다"><rect width="356" height="210" fill="transparent"/>${grid}${candle}</svg>`}
function detail(){const r=selected();$('detail').innerHTML=`<div class="detail-head"><div><div class="detail-name">${esc(r.name)}</div><div class="detail-symbol">${r.code} · ${r.market} · ${esc(r.sector)}</div></div><span class="pill">DEMO</span></div><div class="detail-price mono">${money(r.price)}</div><div class="detail-pricemeta ${r.change>=0?'positive':'negative'}">${percent(r.change)} · 시연 주가 / 갱신 없음</div><div class="detail-pills"><span class="pill">기준가 ${money(r.start)}</span><span class="pill">목표 ${money(r.goal)}</span>${r.top5?'<span class="pill">TOP5</span>':''}</div><div class="right-chart">${drawCandles(r)}<div class="chart-axis">가상 캔들 · 시간축과 가격은 모의 생성값</div></div><div class="info-row"><span>3% Hunter 판정 (샘플)</span>${chip(r.status)}</div><div class="info-row"><span>최초 +3% 도달일 (샘플)</span><b>${r.successDay?'D+'+r.successDay:'—'}</b></div><div class="info-row"><span>MFE / MAE (샘플)</span><b><span class="positive">+${r.mfe.toFixed(2)}%</span> / <span class="negative">${r.mae.toFixed(2)}%</span></b></div><h3 class="detail-h">✦ 왜 선정했을까?</h3><ol class="reasons">${r.reasons.map((x,i)=>`<li><span class="reason-n">${i+1}</span><div class="reason-text"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div></li>`).join('')}</ol><h3 class="detail-h">▤ 선정 당시 메모</h3><div class="notes">가상의 점수와 선정 이유를 표시하는 UI 데모야. 실제 MASTER 연동 후에는 <strong>선정 당시 원본 점수·근거만</strong> 불러오며, 사후 정보로 수정하지 않아.</div>`}
function ticker(){const a=data(),top=a.filter(r=>r.top5),done=completions(a);$('ticker').innerHTML=`<span><i class="live-dot"></i><b class="amber">DEMO · 시세 연동 안 됨</b></span><span>코호트 <strong>DAY ${state.cohort}</strong></span><span>공식 선정 <strong>30종 UI</strong></span><span>샘플 Hunter 성공률 <strong>${winrate(a).toFixed(1)}%</strong></span><span>TOP5 평균 MFE <strong class="green">+${mean(top,'mfe').toFixed(2)}%</strong></span><span>TOP5 평균 MAE <strong class="red">${mean(top,'mae').toFixed(2)}%</strong></span><span>종합 평균 <strong>${mean(a,'total').toFixed(1)}</strong></span><span>주문 <strong>0건</strong></span>`}
function updateSelection(index){state.selected=index;render(false)}
function bind(){document.querySelectorAll('#tabs [data-tab]').forEach(btn=>btn.onclick=()=>{state.tab=btn.dataset.tab;state.search='';state.filter='all';render()});document.querySelectorAll('[data-filter]').forEach(btn=>btn.onclick=()=>{state.filter=btn.dataset.filter;render()});const search=$('search');if(search)search.oninput=e=>{state.search=e.target.value.slice(0,80);const pos=e.target.selectionStart;render(false);const n=$('search');if(n){n.focus();n.setSelectionRange(pos,pos)}};const sort=$('sort');if(sort){sort.value=state.sort;sort.onchange=e=>{state.sort=e.target.value;state.descending=false;render()}}document.querySelectorAll('[data-sort]').forEach(btn=>btn.onclick=()=>{if(['rank','price','change','goal','chart','momentum','total'].includes(btn.dataset.sort)){if(state.sort===btn.dataset.sort)state.descending=!state.descending;else {state.sort=btn.dataset.sort;state.descending=false}render()}});document.querySelectorAll('[data-select]').forEach(row=>{const act=()=>updateSelection(Number(row.dataset.select));row.onclick=act;row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}}});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.tab='days';state.day=Number(b.dataset.day);render()});document.querySelectorAll('[data-scoretab]').forEach(b=>b.onclick=()=>{state.scoreTab=b.dataset.scoretab;render()})}
function render(all=true){if(all){summary();ticker()}document.querySelectorAll('#tabs [data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===state.tab);b.setAttribute('aria-selected',b.dataset.tab===state.tab?'true':'false')});$('content').innerHTML=({realtime,reasons:reasonsView,top5,days,learning}[state.tab])();detail();bind()}
$('cohort').onchange=e=>{state.cohort=e.target.value;state.selected=0;state.filter='all';state.search='';state.day=0;render()};$('closeBanner').onclick=()=>$('banner').remove();render();
</script>
</body>
</html>
